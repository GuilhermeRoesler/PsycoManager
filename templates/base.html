<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PsycoManager{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Fraunces", ui-serif, Georgia, serif;
            --color-brand-50: #f0f7f6;
            --color-brand-100: #d9eeeb;
            --color-brand-200: #b5ddd7;
            --color-brand-500: #2a9d8f;
            --color-brand-600: #1f7a6f;
            --color-brand-700: #1a635a;
            --color-ink: #1c2b2a;
            --color-muted: #5c6f6d;
            --color-surface: #f7faf9;
            --color-line: #d8e5e2;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-ink);
            background-color: #ffffff;
            min-height: 100vh;
        }

        .font-display {
            font-family: var(--font-display);
        }

        .input-field {
            @apply block w-full rounded-lg bg-white px-3.5 py-2.5 text-sm text-ink outline outline-1 -outline-offset-1 outline-line placeholder:text-muted/60 focus:outline-2 focus:-outline-offset-2 focus:outline-brand-500;
        }

        .btn-primary {
            @apply inline-flex items-center justify-center rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600;
        }

        .btn-secondary {
            @apply inline-flex items-center justify-center rounded-lg bg-white px-4 py-2.5 text-sm font-semibold text-ink outline outline-1 -outline-offset-1 outline-line transition hover:bg-brand-50;
        }
    </style>
    {% block 'head' %}{% endblock 'head' %}
</head>

<body class="relative isolate antialiased">
    {# Fundo decorativo: grid com opacidade gradual + mancha no canto direito #}
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
        <svg class="fixed inset-x-0 top-0 h-[64rem] w-full stroke-gray-300 [mask-image:radial-gradient(40rem_40rem_at_center,white,transparent)]"
            aria-hidden="true">
            <defs>
                <pattern id="psyco-grid" width="200" height="200" x="50%" y="-1" patternUnits="userSpaceOnUse">
                    <path d="M.5 200V.5H200" fill="none" />
                </pattern>
            </defs>
            <svg x="50%" y="-1" class="overflow-visible fill-gray-100">
                <path d="M-200 0h201v201h-201Z M600 0h201v201h-201Z M-400 600h201v201h-201Z M200 800h201v201h-201Z"
                    stroke-width="0" />
            </svg>
            <rect width="100%" height="100%" stroke-width="0" fill="url(#psyco-grid)" />
        </svg>
        <div class="fixed left-1/2 right-0 top-0 -ml-24 transform-gpu overflow-hidden blur-3xl lg:ml-24 xl:ml-48"
            aria-hidden="true">
            <div class="aspect-[801/1036] w-[50.0625rem] bg-gradient-to-tr from-[#ff80b5] to-[#9089fc] opacity-30"
                style="clip-path: polygon(63.1% 29.5%, 100% 17.1%, 76.6% 3%, 48.4% 0%, 44.6% 4.7%, 54.5% 25.3%, 59.8% 49%, 55.2% 57.8%, 44.4% 57.2%, 27.8% 47.9%, 35.1% 81.5%, 0% 97.7%, 39.2% 100%, 35.2% 81.4%, 97.2% 52.8%, 63.1% 29.5%)">
            </div>
        </div>
    </div>

    {% block header %}
    <header class="relative border-b border-line/70 bg-white/70 backdrop-blur-md">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8" aria-label="Principal">
            <a href="{% url 'pacientes' %}" class="flex items-center gap-2.5">
                <span class="flex size-9 items-center justify-center rounded-xl bg-brand-600 text-sm font-bold text-white shadow-sm shadow-brand-600/25">P</span>
                <span class="font-display text-xl font-semibold tracking-tight text-ink">PsycoManager</span>
            </a>
            <div class="flex items-center gap-6">
                <a href="{% url 'pacientes' %}" class="text-sm font-semibold text-muted transition hover:text-brand-700">Pacientes</a>
            </div>
        </nav>
    </header>
    {% endblock header %}

    <main class="relative">
        {% block 'body' %}{% endblock 'body' %}
    </main>
</body>

</html>
