<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta — PsycoManager</title>
  <meta name="theme-color" content="#1f7a6f">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="js/styles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
</head>
<body class="antialiased">
  <header class="border-b border-line/80 bg-white">
    <div class="mx-auto flex h-14 max-w-3xl items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-2.5">
        <img src="assets/img/logo.png" alt="" width="32" height="32" class="size-8 rounded-lg shadow-sm ring-1 ring-brand-700/10" decoding="async">
        <span class="font-display text-lg font-semibold tracking-tight text-ink">PsycoManager</span>
      </div>
      <p class="text-xs font-medium uppercase tracking-wider text-muted">Área do paciente</p>
    </div>
  </header>

  <main>
    <div class="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-14" id="app">
      <p class="text-sm text-muted">A carregar…</p>
    </div>
  </main>

  <div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-[100] flex w-[min(100%-2rem,22rem)] flex-col gap-2" aria-live="polite"></div>

  <script>
  (function () {
    const id = Number(new URLSearchParams(location.search).get("id"));
    const state = window.DemoStore.get();
    const consulta = state.consultas.find(function (c) {
      return c.id === id;
    });
    const root = document.getElementById("app");

    if (!consulta) {
      root.innerHTML =
        '<div class="text-center"><h1 class="text-xl font-semibold text-ink">Consulta não encontrada</h1>' +
        '<p class="mt-2 text-sm text-muted">Este link público não existe nesta demo.</p>' +
        '<a href="entrar.html" class="btn-primary mt-6 inline-flex">Ir para o login</a></div>';
      return;
    }

    const paciente = state.pacientes.find(function (p) {
      return p.id === consulta.paciente_id;
    });

    if (!paciente || !paciente.pagamento_em_dia) {
      root.innerHTML =
        '<div class="text-center"><h1 class="text-xl font-semibold text-ink">Indisponível</h1>' +
        '<p class="mt-2 text-sm text-muted">O link público só está ativo com pagamento em dia (como na app Django).</p>' +
        '<a href="entrar.html" class="btn-secondary mt-6 inline-flex">Área do psicólogo</a></div>';
      return;
    }

    // Contar visualização (demo)
    window.DemoStore.update(function (s) {
      const c = s.consultas.find(function (x) {
        return x.id === id;
      });
      if (c) {
        c.views_total = (c.views_total || 0) + 1;
        c.views_unicas = Math.max(c.views_unicas || 0, 1);
      }
    });

    document.title = "Consulta — " + paciente.nome + " — PsycoManager";

    const tarefas = (consulta.tarefas || [])
      .map(function (tid) {
        return state.tarefas.find(function (t) {
          return t.id === tid;
        });
      })
      .filter(Boolean);

    const videoHtml = consulta.video
      ? '<div class="mt-3 overflow-hidden rounded-xl bg-ink shadow-lg shadow-ink/10">' +
        '<div class="flex aspect-video w-full flex-col items-center justify-center gap-2 bg-gradient-to-br from-brand-700 to-ink px-6 text-center text-white">' +
        '<svg class="size-12 opacity-80" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>' +
        '<p class="text-sm font-medium">Gravação simulada</p>' +
        '<p class="text-xs text-white/70">Na app real haveria um vídeo MP4 aqui.</p></div></div>'
      : '<p class="mt-3 rounded-xl bg-white px-4 py-8 text-center text-sm text-muted ring-1 ring-line">Esta sessão não tem gravação de vídeo.</p>';

    const tarefasHtml = tarefas.length
      ? '<ol class="mt-6 space-y-6">' +
        tarefas
          .map(function (t, i) {
            return (
              '<li class="border-t border-line pt-6">' +
              '<div class="flex flex-wrap items-baseline justify-between gap-2">' +
              '<h3 class="text-base font-semibold text-ink"><span class="mr-2 tabular-nums text-brand-600">' +
              (i + 1) +
              ".</span>" +
              t.tarefa +
              '</h3><span class="text-xs font-medium text-muted">' +
              window.DemoFmt.freq(t.frequencia) +
              '</span></div><p class="mt-2 text-sm leading-relaxed text-muted">' +
              t.instrucoes +
              "</p></li>"
            );
          })
          .join("") +
        "</ol>"
      : '<p class="mt-8 text-center text-sm text-muted">Não há exercícios associados a esta sessão.</p>';

    root.innerHTML =
      '<header class="text-center sm:text-left">' +
      '<div class="flex flex-col items-center gap-4 sm:flex-row sm:items-center">' +
      '<img class="size-16 rounded-full object-cover ring-2 ring-white shadow-sm" src="' +
      paciente.foto +
      '" alt="">' +
      '<div><p class="text-xs font-semibold uppercase tracking-wider text-brand-600">Sua sessão</p>' +
      '<h1 class="mt-1 text-2xl font-semibold tracking-tight text-ink sm:text-3xl">' +
      paciente.nome +
      '</h1><p class="mt-1 text-sm text-muted">' +
      window.DemoFmt.dateOnly(consulta.data) +
      "</p></div></div></header>" +
      '<section class="mt-10"><h2 class="text-sm font-semibold uppercase tracking-wider text-muted">Vídeo</h2>' +
      videoHtml +
      "</section>" +
      '<section class="mt-12"><h2 class="text-sm font-semibold uppercase tracking-wider text-muted">Exercícios</h2>' +
      '<p class="mt-1 text-sm text-muted">Tarefas sugeridas entre sessões.</p>' +
      tarefasHtml +
      "</section>";
  })();
  </script>
</body>
</html>
